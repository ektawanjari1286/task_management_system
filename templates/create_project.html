<!DOCTYPE html>
<html>

<head>

    <title>Create Project</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Create New Project</h1>

    <p>
        Enter your actual project/topic.
        The system will generate topic-specific tasks.
    </p>

    <form method="POST" class="project-form">

        <label>Project Name</label>

        <input
            type="text"
            name="title"
            placeholder="Example: ML Classification Project"
            required
        >


        <label>Subject</label>

        <input
            type="text"
            name="subject"
            placeholder="Example: Machine Learning"
            required
        >


        <label>Specific Topic</label>

        <input
            type="text"
            name="topic"
            placeholder="Example: Classification"
            required
        >


        <label>Project Deadline</label>

        <input
            type="date"
            name="deadline"
            required
        >


        <button type="submit">
            Generate Specific Tasks
        </button>

    </form>

    <br>

    <a href="{{ url_for('dashboard') }}">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
